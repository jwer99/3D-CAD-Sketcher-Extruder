services:
  - type: web
    name: voxel3d-cad
    env: node
    plan: free
    region: frankfurt # o oregon / ohio
    buildCommand: npm install --include=dev --legacy-peer-deps && npm run build
    startCommand: node dist-server/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: GEMINI_API_KEY
        sync: false # Configurable en el panel de Render
